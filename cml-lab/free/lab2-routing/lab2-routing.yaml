lab:
  title: CCNA-LAB 2 - Routing & edge (CML-Free)
  description: OSPF (p2p + DR/BDR), static and floating static routes, NAT/PAT, NTP, extended ACL, HSRP.
  notes: See cml-lab/free/README.md in the CCNA repo.
  version: 0.2.2
nodes:
- id: n0
  label: ISP0
  node_definition: iosv
  x: 0
  y: -400
  configuration: |
    ! ISP0 - Lab 2 (routing & edge). Simulated Internet edge + NTP stratum-1 master (CML: IOSv)
    ! Gi0/0 = R1-EDGE
    hostname ISP0
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * ISP0 - simulated Internet edge for CCNA-LAB.            *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
    !
    clock timezone AEST 10 0
    !
    interface GigabitEthernet0/0
     description Link to R1-EDGE (outside)
     ip address 203.0.113.1 255.255.255.248
     no shutdown
    !
    interface Loopback0
     description Simulated Internet host - ping target
     ip address 8.8.8.8 255.255.255.255
    !
    ntp master 1
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R1-EDGE
  node_definition: iosv
  x: 0
  y: -250
  configuration: |
    ! R1-EDGE - Lab 2 (routing & edge). CML: IOSv
    ! Gi0/0 = ISP0 (outside), Gi0/1 = SW-DIST1, Gi0/2 = SW-DIST2, Lo0 = OSPF RID
    hostname R1-EDGE
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * R1-EDGE - CCNA-LAB Internet edge / NAT router.          *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ! Inbound ACL for the outside interface
    ip access-list extended OUTSIDE-IN
     permit icmp any any echo-reply
     permit icmp any any ttl-exceeded
     permit icmp any any unreachable
     permit udp host 203.0.113.1 eq ntp host 203.0.113.2
     permit tcp any host 203.0.113.5 eq www
     permit udp any host 203.0.113.5 eq tftp
     permit tcp any any established
     deny   ip any any
    !
    access-list 1 permit 192.168.0.0 0.0.255.255
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    !
    clock timezone AEST 10 0
    ntp server 203.0.113.1
    !
    snmp-server group SNMP-ADMINS v3 priv
    snmp-server user snmpadmin SNMP-ADMINS v3 auth sha Lab-SnmpAuth1! priv aes 128 Lab-SnmpPriv1!
    !
    interface Loopback0
     description OSPF Router ID
     ip address 1.1.1.1 255.255.255.255
    !
    interface GigabitEthernet0/0
     description Outside - link to ISP0
     ip address 203.0.113.2 255.255.255.248
     ip nat outside
     ip access-group OUTSIDE-IN in
     no shutdown
    !
    interface GigabitEthernet0/1
     description Inside - link to SW-DIST1
     ip address 10.0.12.1 255.255.255.252
     ip ospf network point-to-point
     ip nat inside
     no shutdown
    !
    interface GigabitEthernet0/2
     description Inside - link to SW-DIST2
     ip address 10.0.13.1 255.255.255.252
     ip ospf network point-to-point
     ip nat inside
     no shutdown
    !
    ip route 0.0.0.0 0.0.0.0 203.0.113.1
    !
    router ospf 1
     router-id 1.1.1.1
     network 1.1.1.1 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 10.0.13.0 0.0.0.3 area 0
     default-information originate
    !
    ip nat inside source list 1 interface GigabitEthernet0/0 overload
    ip nat inside source static 192.168.30.10 203.0.113.5
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: SW-DIST1
  node_definition: iosvl2
  x: -200
  y: -80
  configuration: |
    ! SW-DIST1 - Lab 2 (routing & edge). CML: IOSvL2
    ! Gi0/0 = R1-EDGE (routed, OSPF p2p), Gi0/1 = R2-BRANCH (routed, static only)
    ! Gi0/2-3 = Po1 peer link to the other SW-DIST (carries the VLANs so the SVIs come up)
    hostname SW-DIST1
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * SW-DIST1 - CCNA-LAB distribution switch #1.             *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ip routing
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    !
    clock timezone AEST 10 0
    ntp server 10.0.12.1
    !
    snmp-server group SNMP-ADMINS v3 priv
    snmp-server user snmpadmin SNMP-ADMINS v3 auth sha Lab-SnmpAuth1! priv aes 128 Lab-SnmpPriv1!
    !
    cdp run
    lldp run
    !
    vlan 10
     name DATA
    vlan 20
     name VOICE
    vlan 30
     name SERVERS
    vlan 50
     name WIRELESS
    vlan 99
     name MGMT
    vlan 999
     name NATIVE_UNUSED
    !
    spanning-tree mode rapid-pvst
    spanning-tree vlan 10,30,99 root primary
    spanning-tree vlan 20,50 root secondary
    spanning-tree portfast bpduguard default
    spanning-tree loopguard default
    !
    interface Loopback0
     description OSPF Router ID
     ip address 2.2.2.2 255.255.255.255
    !
    interface GigabitEthernet0/0
     description Routed link to R1-EDGE
     no switchport
     ip address 10.0.12.2 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    interface GigabitEthernet0/1
     description Routed link to R2-BRANCH (primary WAN, static only - NOT in OSPF)
     no switchport
     ip address 172.16.12.1 255.255.255.252
     no shutdown
    !
    interface range GigabitEthernet0/2 - 3
     description Po1 member - peer link
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description Peer link to SW-DIST2
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
    !
    interface Vlan10
     description DATA
     ip address 192.168.10.2 255.255.255.0
     ip ospf priority 200
     standby 10 ip 192.168.10.1
     standby 10 priority 110
     standby 10 preempt
     standby 10 authentication CcnaLab1
     no shutdown
    !
    interface Vlan20
     description VOICE
     ip address 192.168.20.2 255.255.255.0
     ip ospf priority 0
     standby 20 ip 192.168.20.1
     standby 20 priority 90
     standby 20 preempt
     standby 20 authentication CcnaLab1
     no shutdown
    !
    interface Vlan30
     description SERVERS
     ip address 192.168.30.2 255.255.255.0
     ip ospf priority 200
     standby 30 ip 192.168.30.1
     standby 30 priority 110
     standby 30 preempt
     standby 30 authentication CcnaLab1
     no shutdown
    !
    interface Vlan50
     description WIRELESS
     ip address 192.168.50.2 255.255.255.0
     ip ospf priority 0
     standby 50 ip 192.168.50.1
     standby 50 priority 90
     standby 50 preempt
     standby 50 authentication CcnaLab1
     no shutdown
    !
    interface Vlan99
     description MGMT
     ip address 192.168.99.2 255.255.255.0
     ip ospf priority 200
     standby 99 ip 192.168.99.1
     standby 99 priority 110
     standby 99 preempt
     standby 99 authentication CcnaLab1
     no shutdown
    !
    router ospf 1
     router-id 2.2.2.2
     network 2.2.2.2 0.0.0.0 area 0
     network 10.0.12.0 0.0.0.3 area 0
     network 192.168.10.0 0.0.0.255 area 0
     network 192.168.20.0 0.0.0.255 area 0
     network 192.168.30.0 0.0.0.255 area 0
     network 192.168.50.0 0.0.0.255 area 0
     network 192.168.99.0 0.0.0.255 area 0
    !
    ! Static network route to the branch LAN via the primary WAN link
    ip route 192.168.40.0 255.255.255.0 172.16.12.2
    !
    interface range GigabitEthernet1/0 - 3
     description Unused in this lab
     shutdown
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
  - id: i5
    label: GigabitEthernet1/0
    slot: 4
    type: physical
  - id: i6
    label: GigabitEthernet1/1
    slot: 5
    type: physical
  - id: i7
    label: GigabitEthernet1/2
    slot: 6
    type: physical
  - id: i8
    label: GigabitEthernet1/3
    slot: 7
    type: physical
- id: n3
  label: SW-DIST2
  node_definition: iosvl2
  x: 200
  y: -80
  configuration: |
    ! SW-DIST2 - Lab 2 (routing & edge). CML: IOSvL2
    ! Gi0/0 = R1-EDGE (routed, OSPF p2p), Gi0/1 = R2-BRANCH (routed, static only)
    ! Gi0/2-3 = Po1 peer link to the other SW-DIST (carries the VLANs so the SVIs come up)
    hostname SW-DIST2
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * SW-DIST2 - CCNA-LAB distribution switch #2.             *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ip routing
    !
    ! Block the VOICE VLAN from SSH/Telnet into the SERVERS VLAN
    ip access-list extended VOICE-RESTRICT
     deny   tcp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 eq 22
     deny   tcp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 eq telnet
     permit ip any any
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    !
    clock timezone AEST 10 0
    ntp server 10.0.13.1
    !
    snmp-server group SNMP-ADMINS v3 priv
    snmp-server user snmpadmin SNMP-ADMINS v3 auth sha Lab-SnmpAuth1! priv aes 128 Lab-SnmpPriv1!
    !
    cdp run
    lldp run
    !
    vlan 10
     name DATA
    vlan 20
     name VOICE
    vlan 30
     name SERVERS
    vlan 50
     name WIRELESS
    vlan 99
     name MGMT
    vlan 999
     name NATIVE_UNUSED
    !
    spanning-tree mode rapid-pvst
    spanning-tree vlan 20,50 root primary
    spanning-tree vlan 10,30,99 root secondary
    spanning-tree portfast bpduguard default
    spanning-tree loopguard default
    !
    interface Loopback0
     description OSPF Router ID
     ip address 3.3.3.3 255.255.255.255
    !
    interface GigabitEthernet0/0
     description Routed link to R1-EDGE
     no switchport
     ip address 10.0.13.2 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    interface GigabitEthernet0/1
     description Routed link to R2-BRANCH (backup WAN, static only - NOT in OSPF)
     no switchport
     ip address 172.16.13.1 255.255.255.252
     no shutdown
    !
    interface range GigabitEthernet0/2 - 3
     description Po1 member - peer link
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description Peer link to SW-DIST1
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
    !
    interface Vlan10
     description DATA
     ip address 192.168.10.3 255.255.255.0
     ip ospf priority 0
     standby 10 ip 192.168.10.1
     standby 10 priority 90
     standby 10 preempt
     standby 10 authentication CcnaLab1
     no shutdown
    !
    interface Vlan20
     description VOICE
     ip address 192.168.20.3 255.255.255.0
     ip access-group VOICE-RESTRICT in
     ip ospf priority 200
     standby 20 ip 192.168.20.1
     standby 20 priority 110
     standby 20 preempt
     standby 20 authentication CcnaLab1
     no shutdown
    !
    interface Vlan30
     description SERVERS
     ip address 192.168.30.3 255.255.255.0
     ip ospf priority 0
     standby 30 ip 192.168.30.1
     standby 30 priority 90
     standby 30 preempt
     standby 30 authentication CcnaLab1
     no shutdown
    !
    interface Vlan50
     description WIRELESS
     ip address 192.168.50.3 255.255.255.0
     ip ospf priority 200
     standby 50 ip 192.168.50.1
     standby 50 priority 110
     standby 50 preempt
     standby 50 authentication CcnaLab1
     no shutdown
    !
    interface Vlan99
     description MGMT
     ip address 192.168.99.3 255.255.255.0
     ip ospf priority 0
     standby 99 ip 192.168.99.1
     standby 99 priority 90
     standby 99 preempt
     standby 99 authentication CcnaLab1
     no shutdown
    !
    router ospf 1
     router-id 3.3.3.3
     network 3.3.3.3 0.0.0.0 area 0
     network 10.0.13.0 0.0.0.3 area 0
     network 192.168.10.0 0.0.0.255 area 0
     network 192.168.20.0 0.0.0.255 area 0
     network 192.168.30.0 0.0.0.255 area 0
     network 192.168.50.0 0.0.0.255 area 0
     network 192.168.99.0 0.0.0.255 area 0
    !
    ! D2 deliberately has NO route to 192.168.40.0/24 - see README (Bonus)
    !
    interface range GigabitEthernet1/0 - 3
     description Unused in this lab
     shutdown
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
  - id: i5
    label: GigabitEthernet1/0
    slot: 4
    type: physical
  - id: i6
    label: GigabitEthernet1/1
    slot: 5
    type: physical
  - id: i7
    label: GigabitEthernet1/2
    slot: 6
    type: physical
  - id: i8
    label: GigabitEthernet1/3
    slot: 7
    type: physical
- id: n4
  label: R2-BRANCH
  node_definition: iosv
  x: 0
  y: 100
  configuration: |
    ! R2-BRANCH - Lab 2 (routing & edge). CML: IOSv
    ! Gi0/0 = SW-DIST1 (primary WAN), Gi0/1 = SW-DIST2 (backup WAN)
    ! Branch LAN is simulated with Loopback1 (no PC5 in this lab)
    hostname R2-BRANCH
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * R2-BRANCH - CCNA-LAB branch router.                     *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    !
    clock timezone AEST 10 0
    ! NTP hierarchy: ISP0 -> R1 -> D1 -> R2
    ntp server 172.16.12.1
    !
    interface GigabitEthernet0/0
     description Primary WAN - link to SW-DIST1
     ip address 172.16.12.2 255.255.255.252
     no shutdown
    !
    interface GigabitEthernet0/1
     description Backup WAN - link to SW-DIST2
     ip address 172.16.13.2 255.255.255.252
     no shutdown
    !
    ! Primary default route
    ip route 0.0.0.0 0.0.0.0 172.16.12.1
    ! Floating static default route (AD 200) - only used if the primary is withdrawn
    ip route 0.0.0.0 0.0.0.0 172.16.13.1 200
    !
    interface Loopback1
     description Branch LAN (simulated - replaces Gi0/2 + PC5)
     ip address 192.168.40.1 255.255.255.0
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: ISP0 GigabitEthernet0/0 <-> R1-EDGE GigabitEthernet0/0
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i1
  label: R1-EDGE GigabitEthernet0/1 <-> SW-DIST1 GigabitEthernet0/0
- id: l2
  n1: n1
  i1: i3
  n2: n3
  i2: i1
  label: R1-EDGE GigabitEthernet0/2 <-> SW-DIST2 GigabitEthernet0/0
- id: l3
  n1: n2
  i1: i2
  n2: n4
  i2: i1
  label: SW-DIST1 GigabitEthernet0/1 <-> R2-BRANCH GigabitEthernet0/0
- id: l4
  n1: n3
  i1: i2
  n2: n4
  i2: i2
  label: SW-DIST2 GigabitEthernet0/1 <-> R2-BRANCH GigabitEthernet0/1
- id: l5
  n1: n2
  i1: i3
  n2: n3
  i2: i3
  label: SW-DIST1 GigabitEthernet0/2 <-> SW-DIST2 GigabitEthernet0/2
- id: l6
  n1: n2
  i1: i4
  n2: n3
  i2: i4
  label: SW-DIST1 GigabitEthernet0/3 <-> SW-DIST2 GigabitEthernet0/3
annotations: []
