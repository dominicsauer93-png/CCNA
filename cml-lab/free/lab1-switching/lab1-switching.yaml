    ntp server 192.168.99.2
    !
    cdp run
    lldp run
    !
    vlan 10
     name DATA
    vlan 20
     name VOICE
    vlan 30
     name SERVERS
    vlan 50
     name WIRELESS
    vlan 99
     name MGMT
    vlan 999
     name NATIVE_UNUSED
    !
    spanning-tree mode rapid-pvst
    spanning-tree portfast bpduguard default
    spanning-tree loopguard default
    !
    ip dhcp snooping vlan 10,20,50,99
    no ip dhcp snooping information option
    ip dhcp snooping
    ip arp inspection vlan 10,20,50,99
    !
    interface Vlan1
     no ip address
     shutdown
    !
    interface Vlan99
     description MGMT
     ip address 192.168.99.10 255.255.255.0
     no shutdown
    !
    ip default-gateway 192.168.99.1
    !
    interface range GigabitEthernet0/0 - 1
     description Po1 member - uplink to SW-DIST1
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description Uplink to SW-DIST1
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     ip dhcp snooping trust
     ip arp inspection trust
    !
    interface GigabitEthernet0/2
     description PC1
     switchport mode access
     switchport access vlan 10
     switchport nonegotiate
     spanning-tree portfast edge
     spanning-tree bpduguard enable
     switchport port-security
     switchport port-security maximum 2
     switchport port-security mac-address sticky
     switchport port-security violation restrict
     no shutdown
    !
    interface GigabitEthernet0/3
     description PC2 + IP phone (data + voice)
     switchport mode access
     switchport access vlan 10
     switchport voice vlan 20
     switchport nonegotiate
     spanning-tree portfast edge
     spanning-tree bpduguard enable
     switchport port-security
     switchport port-security maximum 3
     switchport port-security mac-address sticky
     switchport port-security violation restrict
     no shutdown
    !
    interface GigabitEthernet1/0
     description PC-ADMIN
     switchport mode access
     switchport access vlan 99
     switchport nonegotiate
     spanning-tree portfast edge
     spanning-tree bpduguard enable
     switchport port-security
     switchport port-security maximum 1
     switchport port-security mac-address sticky
     switchport port-security violation restrict
     no shutdown
    !
    interface GigabitEthernet1/1
     description PC-WIFI (stands in for the wireless client)
     switchport mode access
     switchport access vlan 50
     switchport nonegotiate
     spanning-tree portfast edge
     spanning-tree bpduguard enable
     switchport port-security
     switchport port-security maximum 2
     switchport port-security mac-address sticky
     switchport port-security violation restrict
     no shutdown
    !
    interface range GigabitEthernet1/2 - 3
     description Unused
     shutdown
    !
    end
