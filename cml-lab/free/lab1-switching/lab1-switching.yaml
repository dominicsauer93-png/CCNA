lab:
  title: CCNA-LAB 1 - Switching (CML-Free)
  description: VLANs, trunks, EtherChannel (LACP), Rapid PVST+, HSRP, inter-VLAN routing, DHCP snooping, DAI and port security.
  notes: See cml-lab/free/README.md in the CCNA repo.
  version: 0.2.2
nodes:
- id: n0
  label: SW-DIST1
  node_definition: iosvl2
  x: -200
  y: -80
  configuration: |
    ! SW-DIST1 - Lab 1 (switching). CML: IOSvL2
    ! Gi0/2-3 = Po1 peer link, Gi1/0-1 = Po10 uplink to SW-ACC1
    ! Gi0/0-1 unused (no routers in this lab)
    hostname SW-DIST1
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * SW-DIST1 - CCNA-LAB distribution switch #1.             *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ip routing
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    !
    clock timezone AEST 10 0
    !
    cdp run
    lldp run
    !
    vlan 10
     name DATA
    vlan 20
     name VOICE
    vlan 30
     name SERVERS
    vlan 50
     name WIRELESS
    vlan 99
     name MGMT
    vlan 999
     name NATIVE_UNUSED
    !
    spanning-tree mode rapid-pvst
    spanning-tree vlan 10,30,99 root primary
    spanning-tree vlan 20,50 root secondary
    spanning-tree portfast bpduguard default
    spanning-tree loopguard default
    !
    ip dhcp snooping vlan 10,20,50,99
    no ip dhcp snooping information option
    ip dhcp snooping
    ip arp inspection vlan 10,20,50,99
    !
    interface Loopback0
     description OSPF Router ID
     ip address 2.2.2.2 255.255.255.255
    !
    interface range GigabitEthernet0/2 - 3
     description Po1 member - peer link
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     channel-group 1 mode active
     no shutdown
    !
    interface Port-channel1
     description Peer link to SW-DIST2
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     ip dhcp snooping trust
     ip arp inspection trust
    !
    interface range GigabitEthernet1/0 - 1
     description Po10 member - uplink to SW-ACC1
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     channel-group 10 mode active
     no shutdown
    !
    interface Port-channel10
     description Uplink to SW-ACC1
     switchport trunk encapsulation dot1q
     switchport trunk native vlan 999
     switchport trunk allowed vlan 10,20,30,50,99
     switchport mode trunk
     switchport nonegotiate
     ip dhcp snooping trust
     ip arp inspection trust
    !
    interface range GigabitEthernet1/2 - 3
     description Unused
     shutdown
    !
    interface Vlan10
     description DATA
     ip address 192.168.10.2 255.255.255.0
     standby 10 ip 192.168.10.1
     standby 10 priority 110
     standby 10 preempt
     standby 10 authentication CcnaLab1
     no shutdown
    !
    interface Vlan20
     description VOICE
     ip address 192.168.20.2 255.255.255.0
     standby 20 ip 192.168.20.1
     standby 20 priority 90
     standby 20 preempt
     standby 20 authentication CcnaLab1
     no shutdown
    !
    interface Vlan30
     description SERVERS
     ip address 192.168.30.2 255.255.255.0
     standby 30 ip 192.168.30.1
     standby 30 priority 110
     standby 30 preempt
     standby 30 authentication CcnaLab1
     no shutdown
    !
    interface Vlan50
     description WIRELESS
     ip address 192.168.50.2 255.255.255.0
     standby 50 ip 192.168.50.1
     standby 50 priority 90
     standby 50 preempt
     standby 50 authentication CcnaLab1
     no shutdown
    !
    interface Vlan99
     description MGMT
     ip address 192.168.99.2 255.255.255.0
     standby 99 ip 192.168.99.1
     standby 99 priority 110
     standby 99 preempt
     standby 99 authentication CcnaLab1
     no shutdown
    !
    interface range GigabitEthernet0/0 - 1
     description Unused in this lab
     shutdown
    !
    ! NTP source for this lab (ISP0/R1 are in Lab 2)
    ntp master 3
    !
    ! DHCP server for this lab (the full lab uses SERVER1 + ip helper-address instead)
    ip dhcp excluded-address 192.168.10.1 192.168.10.10
    ip dhcp excluded-address 192.168.20.1 192.168.20.10
    ip dhcp excluded-address 192.168.50.1 192.168.50.10
    ip dhcp excluded-address 192.168.99.1 192.168.99.99
    !
    ip dhcp pool DATA
     network 192.168.10.0 255.255.255.0
     default-router 192.168.10.1
     domain-name lab.local
    !
    ip dhcp pool VOICE
     network 192.168.20.0 255.255.255.0
     default-router 192.168.20.1
     domain-name lab.local
    !
    ip dhcp pool WIRELESS
     network 192.168.50.0 255.255.255.0
     default-router 192.168.50.1
     domain-name lab.local
    !
    ip dhcp pool MGMT
     network 192.168.99.0 255.255.255.0
     default-router 192.168.99.1
     domain-name lab.local
    !
    end
