- id: n4
  label: R2-BRANCH
  node_definition: iosv
  x: 0
  y: 60
  configuration: |
    ! R2-BRANCH - branch router, static routing only (CML: IOSv)
    ! Gi0/0 = SW-DIST1 (primary WAN), Gi0/1 = SW-DIST2 (backup WAN), Gi0/2 = branch LAN (PC5)
    hostname R2-BRANCH
    no ip domain-lookup
    ip domain-name lab.local
    !
    enable secret Lab-Enable1!
    service password-encryption
    !
    username admin privilege 15 secret Lab-Admin1!
    ! Account used by CML's console automation (cml-mcp / pyATS). Lab use only.
    username cisco privilege 15 secret cisco
    !
    banner motd #
    ***********************************************************
    * R2-BRANCH - CCNA-LAB branch router.                     *
    * Authorized lab use only. All access logged.             *
    ***********************************************************
    #
    !
    crypto key generate rsa general-keys modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3
    !
    ip access-list standard MGMT-ACCESS
     permit 192.168.99.0 0.0.0.255
     deny   any
    !
    line con 0
     login local
     exec-timeout 30 0
     logging synchronous
    line vty 0 4
     transport input ssh
     login local
     access-class MGMT-ACCESS in
     exec-timeout 10 0
     logging synchronous
    !
    service timestamps log datetime msec
    logging buffered 16384
    logging host 192.168.30.10
    !
    clock timezone AEST 10 0
    ! NTP hierarchy: ISP0 -> R1 -> D1 -> R2
    ntp server 172.16.12.1
    !
    interface GigabitEthernet0/0
     description Primary WAN - link to SW-DIST1
     ip address 172.16.12.2 255.255.255.252
     no shutdown
    !
    interface GigabitEthernet0/1
     description Backup WAN - link to SW-DIST2
     ip address 172.16.13.2 255.255.255.252
     no shutdown
    !
    interface GigabitEthernet0/2
     description Branch LAN
     ip address 192.168.40.1 255.255.255.0
     no shutdown
    !
    ! Primary default route
    ip route 0.0.0.0 0.0.0.0 172.16.12.1
    ! Floating static default route (AD 200) - only used if the primary is withdrawn
    ip route 0.0.0.0 0.0.0.0 172.16.13.1 200
    !
    ip dhcp excluded-address 192.168.40.1 192.168.40.10
    ip dhcp pool BRANCH-LAN
     network 192.168.40.0 255.255.255.0
     default-router 192.168.40.1
     dns-server 192.168.30.10
     domain-name lab.local
    !
    end
  tags: []
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i2
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i3
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i4
